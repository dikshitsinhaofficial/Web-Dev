<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="sign_up.css">
</head>
<body>

<div class="container">

    <!-- LEFT SIDE FORM -->
    <div class="sign_up">
        <h2>Get Started Now</h2>

        <form class="formcont">
            
            <label>
                Name
                <input class="name" required type="text" placeholder="Enter your Name">
            </label>

            <label>
                Email address
                <input class="email" required type="email" placeholder="Enter your email">
            </label>

            <label>
                Password
                <input class="pass" required type="password" placeholder="Password">
            </label>

            <label>
                <input type="checkbox" id="tmc">
                I agree to the terms & policy
            </label>

            <button type="submit">Signup</button>

        </form>
    </div>

    <!-- RIGHT SIDE IMAGE -->
    <div class="image"></div>

</div>

<script src="sign_up.js"></script>

</body>
</html>
