<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="global.css">
    <script src="global.js"></script>
</head>
<body>  
    
    <div class="container">
      
        <div class ="sign_up">

        <h2>Get Started Now</h2><br><br>
        <form>

        <p id="successing" class="success"></p>
    
        <label>Email</label>
        <input type="username" id="email" placeholder="Enter your email">
        <small class="error" id="emailError"></small><br>
    

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter your password">
    <small class="error" id="passwordError"></small><br>

    <label>Phone No</label>
    <input type="phone" id="phone" placeholder="Enter your phone no">
    <small class="error" id="phoneError"></small><br>

    <label>
    <input type="checkbox" id="terms">I have accepted the terms and condition
    </label><br>

    <button type="submit">Sign Up</button><br><br>


</form>
</div>

<div class="image"></div>
</div>

</body>
</html>
